name: Selenium Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Clean previous reports
        run: rm -rf reports target/surefire-reports
      - name: Run all Selenium tests
        run: mvn clean test -Dbrowser=chrome -Denv=staging -Dheadless=true -Duser.timezone=Asia/Kolkata
      - name: Prepare current Extent report
        if: always()
        shell: bash
        run: |
          latest_report="$(ls -t reports/ExtentReport-*.html 2>/dev/null | head -n 1 || true)"
          if [ -n "$latest_report" ]; then
            cp "$latest_report" reports/CurrentExtentReport.html
          fi
      - name: Build email summary
        id: email-summary
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ job.status }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > email-summary.txt
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          tests = failures = errors = skipped = 0
          time_seconds = 0.0
          lines = []

          for report in reports:
              root = ET.parse(report).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
              time_seconds += float(root.attrib.get("time", 0))
              for case in root.findall("testcase"):
                  name = case.attrib.get("name", "unknown")
                  classname = case.attrib.get("classname", "")
                  status = "PASSED"
                  if case.find("failure") is not None:
                      status = "FAILED"
                  elif case.find("error") is not None:
                      status = "ERROR"
                  elif case.find("skipped") is not None:
                      status = "SKIPPED"
                  lines.append(f"- {classname}.{name}: {status}")

          current_extent = Path("reports/CurrentExtentReport.html")
          latest_extent = current_extent if current_extent.exists() else None

          print(f"Test result: {os.environ['TEST_RESULT']}")
          print(f"Total tests: {tests}")
          print(f"Passed: {tests - failures - errors - skipped}")
          print(f"Failed: {failures}")
          print(f"Errors: {errors}")
          print(f"Skipped: {skipped}")
          print(f"Duration: {time_seconds:.3f} seconds")
          print()
          print("Test cases:")
          print("\n".join(lines) if lines else "- No test case XML found")
          print()
          print(f"Current Extent report: {latest_extent if latest_extent else 'Not generated'}")
          print()
          print(f"Git repository: {os.environ['REPOSITORY_URL']}")
          print(f"Branch: {os.environ['BRANCH_NAME']}")
          print(f"Commit: {os.environ['COMMIT_URL']}")
          print(f"GitHub Actions run: {os.environ['RUN_URL']}")
          PY
          {
            echo 'body<<EOF'
            cat email-summary.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            reports/CurrentExtentReport.html
            target/surefire-reports/**
      - name: Email test result
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Selenium tests ${{ job.status }} for ${{ github.repository }}
          to: ${{ secrets.NOTIFICATION_EMAIL || 'dhamneravi111@gmail.com' }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: file://email-summary.txt
          attachments: reports/CurrentExtentReport.html
